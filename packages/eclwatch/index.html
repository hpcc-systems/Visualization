<!DOCTYPE html>
<html>

<head>
    <title>Home</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }

        h1 {
            text-align: center;
            margin-top: 50px;
        }

        .placeholder {
            width: 100%;
            height: 500px;
            background-color: #fff;
            margin-top: 20px;
        }
    </style>
</head>

<body onresize="doResize()">
    <h1>ESM Quick Test</h1>
    <div id="placeholder1" class="placeholder"></div>
    <div id="placeholder2" class="placeholder"></div>
    <script type="module">
        import { WUTimelineNoFetch } from "./tests/index.ts";
        import { WUResult } from "./src/index.ts";

        const ESP_URL = window.location.origin;
        const WUID = "W20260910-093648";
        const RESULT_NAME = "Result 1";

        const timeline = new WUTimelineNoFetch()
            .target("placeholder1")
            .height(320)
            ;

        timeline.demo(ESP_URL, WUID);

        window.__widget = new WUResult()
            .target("placeholder2")
            .baseUrl(ESP_URL)
            .wuid(WUID)
            .resultName(RESULT_NAME)
            .pagination(true)
            .render()
            ;
    </script>
    <script>
        function doResize() {
            window.__widget?.resize()?.render();
        }
    </script>
</body>

</html>
